<head>

<style>
/* ── Reset aislado con prefijo amr- ── */
.amr-card *, .amr-card *::before, .amr-card *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  line-height: normal;
}

/* ── Contenedor principal ── */
.amr-card {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  overflow: hidden;
  color: #1a202c;
}

/* ── CABECERA ── */
.amr-header {
  background: #0D2B5E;
  padding: 28px 24px 22px;
  position: relative;
}
.amr-header::after {
  content: '';
  display: block;
  height: 2px;
  background: linear-gradient(90deg, #B8960C 0%, rgba(184,150,12,0) 70%);
  margin-top: 18px;
}
.amr-logo {
  height: 28px;
  width: auto;
  display: block;
  margin-bottom: 18px;
  filter: brightness(0) invert(1);
}
.amr-name {
  font-size: 22px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.3px;
  line-height: 1.2;
}
.amr-role {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-top: 5px;
}

/* ── LISTA CONTACTO ── */
.amr-list {
  padding: 8px 0;
  border-bottom: 1px solid #f1f5f9;
}
.amr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 24px;
  text-decoration: none;
  color: inherit;
  transition: background 0.15s;
  cursor: pointer;
}
a.amr-row:hover { background: #f8fafc; }
.amr-icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: #f0f4fb;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.amr-icon svg {
  width: 16px;
  height: 16px;
  stroke: #0D2B5E;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.amr-icon svg.filled { fill: #0D2B5E; stroke: none; }
.amr-info { display: flex; flex-direction: column; min-width: 0; }
.amr-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #94a3b8;
  margin-bottom: 1px;
}
.amr-value {
  font-size: 13.5px;
  color: #1e293b;
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── REDES SOCIALES ── */
.amr-social {
  display: flex;
  gap: 8px;
  padding: 16px 24px;
  border-bottom: 1px solid #f1f5f9;
}
.amr-social-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 13px;
  border-radius: 20px;
  border: 1px solid #e2e8f0;
  text-decoration: none;
  color: #475569;
  font-size: 11.5px;
  font-weight: 500;
  transition: border-color 0.2s, background 0.2s, color 0.2s;
  white-space: nowrap;
}
.amr-social-btn:hover {
  border-color: #0D2B5E;
  background: #0D2B5E;
  color: #fff;
}
.amr-social-btn svg {
  width: 13px; height: 13px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  flex-shrink: 0;
}

/* ── BOTONES ── */
.amr-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px 24px;
  border-bottom: 1px solid #f1f5f9;
}
.amr-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  border: none;
  transition: opacity 0.15s, transform 0.15s;
  letter-spacing: 0.2px;
}
.amr-btn:hover { opacity: 0.88; transform: translateY(-1px); }
.amr-btn svg {
  width: 17px; height: 17px;
  flex-shrink: 0;
}
.amr-btn-wa {
  background: #22c55e;
  color: #fff;
}
.amr-btn-wa svg { fill: #fff; }
.amr-btn-save {
  background: #0D2B5E;
  color: #fff;
}
.amr-btn-save svg {
  stroke: #fff;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── QR ── */
.amr-qr {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 18px 24px 20px;
  border-bottom: 1px solid #f1f5f9;
}
.amr-qr-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: #94a3b8;
}
.amr-qr-box {
  padding: 8px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  background: #fff;
  line-height: 0;
}
.amr-qr-box canvas {
  display: block;
  width: 140px;
  height: 140px;
}

/* ── FOOTER ── */
.amr-footer {
  text-align: center;
  padding: 14px 24px;
  font-size: 10px;
  color: #cbd5e1;
  letter-spacing: 0.4px;
}
</style>
